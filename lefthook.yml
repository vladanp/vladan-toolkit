# Git hooks, installed automatically by `pnpm install` (lefthook's postinstall).

# Fast (about 1 to 2 s): autofix format/lint on staged files only, plus a typecheck.
# The typecheck sees the whole working tree (tsc can't check "staged only"); pre-push is the real gate.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,ts,jsx,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

# Conventional commits (feat:, fix:, ...) drive automatic versioning + CHANGELOG.
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

# Full gate: refuses dirty trees / branches that are not checked out / local .env files, then runs `pnpm verify`
# (typecheck, lint, unit tests, build, e2e) on exactly what is pushed. Tag only pushes skip verify.
pre-push:
  jobs:
    - name: verify-what-lands
      run: node scripts/check-push.ts
      use_stdin: true
