name: Release

# Push to main: release-please keeps a "Release PR" up to date (version bump + CHANGELOG). Merging it
# creates the tag + GitHub Release; then full CI runs on that tag, and only if it passes is the tested
# zip attached to the release and published to the Chrome Web Store.
#
# Manual run (Actions > Release > Run workflow): republish an existing tag (e.g. after a failed
# publish), or with "dry run" just check the Web Store credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to (re)publish, e.g. v0.2.0 (any branch is fine for a dry run)
        required: true
        default: main
      dry_run:
        description: 'Dry run: only check Chrome Web Store credentials, upload nothing'
        type: boolean
        default: true

# One release run at a time, so overlapping pushes can't race release-please or publish twice.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  target:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      dry_run: ${{ steps.pick.outputs.dry_run }}
    steps:
      - id: pick
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.release-please.outputs.tag_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

  verify:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.target.outputs.ref }}

  publish:
    needs: [target, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store # holds CHROME_SUBMIT_ENV; only usable from main
    permissions:
      contents: write # attach the zip to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # No lifecycle scripts: nothing but `wxt submit` runs project/dependency code in this job.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the zip CI just tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vladan-toolkit-chrome
          path: .output

      - name: Attach zip to GitHub Release
        if: needs.target.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.ref }}
        run: gh release upload "$TAG" .output/*-chrome.zip --clobber --repo "$GITHUB_REPOSITORY"

      # Opt in: set the repo variable CWS_PUBLISH=true once the store listing is complete.
      # Dry runs always run, so credentials can be checked before that.
      - name: Publish to Chrome Web Store
        if: vars.CWS_PUBLISH == 'true' || needs.target.outputs.dry_run == 'true'
        env:
          # Only this step sees the key: the whole `.env.submit` from `pnpm wxt submit init` (API v2).
          CHROME_SUBMIT_ENV: ${{ secrets.CHROME_SUBMIT_ENV }}
          DRY_RUN: ${{ needs.target.outputs.dry_run }}
        run: |
          if [ -z "$CHROME_SUBMIT_ENV" ]; then
            echo "::notice::CHROME_SUBMIT_ENV not set, so the Web Store publish was skipped. See README > Chrome Web Store."
            exit 0
          fi
          printf '%s\n' "$CHROME_SUBMIT_ENV" > .env.submit
          if [ "$DRY_RUN" = "true" ]; then extra=--dry-run; else extra=; fi
          pnpm wxt submit --chrome-zip .output/*-chrome.zip $extra
