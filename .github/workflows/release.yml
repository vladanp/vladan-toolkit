name: Release

# On every push to main, release-please keeps a "Release PR" up to date (version bump + CHANGELOG).
# Merging that PR creates a GitHub Release, runs full CI, then attaches the tested zip and
# publishes it to the Chrome Web Store.
on:
  push:
    branches: [main]

# One release run at a time, so overlapping pushes can't race release-please or double-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the zip CI just tested
        uses: actions/download-artifact@v4
        with:
          name: vladan-toolkit-chrome
          path: .output

      - name: Attach zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" .output/*-chrome.zip --clobber

      - name: Publish to Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip

      - name: Skip Chrome Web Store (secrets not configured)
        if: env.CHROME_EXTENSION_ID == ''
        run: echo "::notice::CHROME_* secrets not set - skipped Web Store publish. See README > Chrome Web Store."
