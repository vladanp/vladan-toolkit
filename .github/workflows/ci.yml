name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml, so nothing is published without passing CI
    inputs:
      ref:
        description: Git ref (release tag) to verify and build
        type: string
        required: true

concurrency:
  # PRs: newest run wins. Pushes and release calls: one group per commit, so no result is dropped.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }} # empty = the commit that triggered the run
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from "packageManager")

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Typecheck + lint
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: E2E tests (builds + zips, then loads that build into real Chromium)
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vladan-toolkit-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true # .output is a dot-folder

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # Squash merges use the PR title as the commit message, which drives release-please.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm commitlint
