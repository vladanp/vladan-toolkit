name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so nothing is published without passing CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Typecheck + lint
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: E2E tests (builds + zips, then loads that build into real Chromium)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        with:
          name: vladan-toolkit-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true # .output is a dot-folder

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
