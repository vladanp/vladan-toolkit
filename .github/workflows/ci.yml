name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install (also downloads Playwright Chromium via postinstall)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Typecheck + lint
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: E2E tests (real Chromium with the extension loaded)
        run: pnpm e2e

      - name: Zip extension
        run: pnpm zip

      - uses: actions/upload-artifact@v4
        with:
          name: vladan-toolkit-chrome
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true # .output is a dot-folder

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
