<!doctype html>
<!--
  Offline model of an article page with a sticky header and a fixed bottom bar (hidden while
  scrolled), and fixed elements that aren't bars: a narrow sidebar and a "back to top" button.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example article</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #header { position: sticky; top: 0; height: 60px; background: #1e3a8a; color: #fff; }
      #bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: #fde68a; }
      #sidebar { position: fixed; top: 0; left: 0; width: 120px; height: 100vh; background: #e5e7eb; }
      #to-top { position: fixed; bottom: 70px; right: 20px; width: 40px; height: 40px; background: #111; }
      article { margin-left: 140px; height: 4000px; }
    </style>
  </head>
  <body>
    <header id="header">Example news · Sections · Subscribe</header>
    <nav id="sidebar">Sections</nav>
    <article id="article">A long article.</article>
    <div id="bottom-bar">Get the app</div>
    <button id="to-top" type="button" aria-label="Back to top"></button>
  </body>
</html>
