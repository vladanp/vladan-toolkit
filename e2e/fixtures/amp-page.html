<!doctype html>
<!-- A news site's AMP version of a story; its canonical link is the normal page. -->
<html amp lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Story (AMP)</title>
    <link rel="canonical" href="/story" />
  </head>
  <body>
    <h1>Story, AMP version</h1>
  </body>
</html>
